{% extends "base.html" %}

{% block title %}Settings - Green Growth - GROOT{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1 class="mb-4"><i class="fas fa-cog me-2" style="color: #28a745;"></i>Settings</h1>
        <div class="card">
            <div class="card-body">
                <form method="POST" action="{{ url_for('web.settings') }}">
                    <div class="mb-3">
                        <label for="display_name" class="form-label">Display Name</label>
                        <input type="text" class="form-control" id="display_name" name="display_name" value="{{ prefs.display_name }}">
                    </div>

                    <div class="mb-3">
                        <label for="contact_email" class="form-label">Contact Email</label>
                        <input type="email" class="form-control" id="contact_email" name="contact_email" value="{{ prefs.contact_email }}">
                    </div>

                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
